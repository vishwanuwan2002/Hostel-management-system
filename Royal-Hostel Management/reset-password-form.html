<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Create New Password - StayEasy</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .reset-form-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 50px;
            animation: slideIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-icon {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-icon i {
            font-size: 3rem;
            color: #667eea;
        }
        
        h2 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
            text-align: center;
        }
        
        .form-subtitle {
            color: #999;
            font-size: 0.95rem;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input::placeholder {
            color: #bbb;
        }
        
        .password-requirements {
            background: #f5f7fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
        }
        
        .requirement {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .requirement i {
            margin-right: 8px;
            color: #ccc;
            font-size: 0.8rem;
        }
        
        .requirement.met i {
            color: #28a745;
        }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .alert-message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            display: none;
        }
        
        .alert-message.show {
            display: block;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .alert-warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        
        .back-link {
            text-align: center;
            font-size: 0.95rem;
            color: #666;
        }
        
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
        }
        
        .back-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 600px) {
            .reset-form-container {
                padding: 30px;
            }
            
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="reset-form-container">
        <div class="form-icon">
            <i class="fa fa-lock"></i>
        </div>
        
        <h2>Create New Password</h2>
        <p class="form-subtitle">Enter your new password below</p>
        
        <!-- Alert Messages -->
        <div id="alertMessage" class="alert-message"></div>
        
        <form id="newPasswordForm" method="POST" action="process-reset.php">
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Enter your new password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your new password" required>
            </div>
            
            <div class="password-requirements">
                <strong style="color: #333;">Password Requirements:</strong>
                <div class="requirement">
                    <i class="fa fa-circle"></i>
                    <span>At least 6 characters long</span>
                </div>
                <div class="requirement">
                    <i class="fa fa-circle"></i>
                    <span>Passwords must match</span>
                </div>
            </div>
            
            <input type="hidden" id="token" name="token" value="">
            <input type="hidden" name="action" value="reset_password">
            
            <button type="submit" class="submit-btn" id="submitBtn">Reset Password</button>
        </form>
        
        <div class="back-link">
            <a href="user-login.html">Back to Login</a>
        </div>
    </div>
    
    <script>
        // Get token from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        const alertDiv = document.getElementById('alertMessage');
        const form = document.getElementById('newPasswordForm');
        const tokenInput = document.getElementById('token');
        const submitBtn = document.getElementById('submitBtn');
        
        // Validate token on page load
        if (!token) {
            alertDiv.className = 'alert-message show alert-danger';
            alertDiv.textContent = 'Invalid or missing reset link. Please request a new password reset.';
            submitBtn.disabled = true;
            form.style.opacity = '0.5';
            form.style.pointerEvents = 'none';
        } else {
            tokenInput.value = token;
        }
        
        // Password validation and requirements display
        const newPasswordInput = document.getElementById('new_password');
        const confirmPasswordInput = document.getElementById('confirm_password');
        const requirements = document.querySelectorAll('.requirement');
        
        function updateRequirements() {
            const password = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            // Check length
            if (password.length >= 6) {
                requirements[0].classList.add('met');
            } else {
                requirements[0].classList.remove('met');
            }
            
            // Check if passwords match
            if (password && confirmPassword && password === confirmPassword && password.length >= 6) {
                requirements[1].classList.add('met');
            } else {
                requirements[1].classList.remove('met');
            }
        }
        
        newPasswordInput.addEventListener('input', updateRequirements);
        confirmPasswordInput.addEventListener('input', updateRequirements);
        
        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            // Validation
            if (!newPassword || !confirmPassword) {
                alertDiv.className = 'alert-message show alert-danger';
                alertDiv.textContent = 'Both password fields are required!';
                return;
            }
            
            if (newPassword.length < 6) {
                alertDiv.className = 'alert-message show alert-danger';
                alertDiv.textContent = 'Password must be at least 6 characters!';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                alertDiv.className = 'alert-message show alert-danger';
                alertDiv.textContent = 'Passwords do not match!';
                return;
            }
            
            // Show loading state
            submitBtn.textContent = 'Resetting...';
            submitBtn.disabled = true;
            
            const formData = new FormData(this);
            
            fetch('process-reset.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alertDiv.className = 'alert-message show alert-success';
                    alertDiv.textContent = data.message;
                    form.reset();
                    setTimeout(() => {
                        window.location.href = 'user-login.html';
                    }, 2000);
                } else {
                    alertDiv.className = 'alert-message show alert-danger';
                    alertDiv.textContent = data.message;
                    submitBtn.textContent = 'Reset Password';
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                alertDiv.className = 'alert-message show alert-danger';
                alertDiv.textContent = 'An error occurred. Please try again.';
                console.error('Error:', error);
                submitBtn.textContent = 'Reset Password';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>

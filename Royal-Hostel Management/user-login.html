<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>User Login - StayEasy</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <style>
        /* CSS styles from original file remain unchanged */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #161a2d 0%, #0b0c43 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            animation: slideIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-visual {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.123) 0%, rgba(245, 243, 247, 0.443) 100%), url('image/banner/banner-01.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .login-visual::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }
        
        .login-visual::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
        }
        
        .login-visual-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        
        .login-visual h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .login-visual p {
            font-size: 1rem;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .login-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        .login-form-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .login-form-section h3 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .login-form-subtitle {
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        
        .form-group input::placeholder {
            color: #bbb;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        
        .remember-forgot a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .remember-forgot a:hover {
            text-decoration: underline;
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .alert-message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            display: none;
        }
        
        .alert-message.show {
            display: block;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95rem;
            color: #666;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 700;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #ddd;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        
        .divider span {
            margin: 0 10px;
            color: #999;
            font-size: 0.9rem;
        }
        
        .social-login {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        
        .social-btn:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }
        
        .social-btn i {
            font-size: 1.1rem;
        }
        
        .google-btn {
            border-color: #db4437;
            color: #db4437;
        }
        
        .google-btn:hover {
            border-color: #db4437;
            background: #fafafa;
            box-shadow: 0 4px 12px rgba(219, 68, 55, 0.15);
        }
        
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }
            
            .login-visual {
                padding: 30px;
                min-height: 250px;
            }
            
            .login-visual h2 {
                font-size: 1.8rem;
            }
            
            .login-form-section {
                padding: 30px;
            }
            
            .login-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-visual">
            <div class="login-visual-content">
                <div class="login-icon">
                    <i class="fa fa-lock"></i>
                </div>
                <h2>Welcome Back!</h2>
                <p>Sign in to your account and explore the best hostels and accommodations.</p>
            </div>
        </div>
        
        <div class="login-form-section">
            <h3>Login</h3>
            <p class="login-form-subtitle">Enter your details to access your account</p>
            
            <div id="alertMessage" class="alert-message"></div>
            
            <form id="loginForm" method="POST" action="process-login.php">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <div class="remember-forgot">
                    <label style="font-weight: 500; margin-bottom: 0;">
                        <input type="checkbox" name="remember" style="margin-right: 5px;"> Remember me
                    </label>
                    <a href="reset-password.html">Forgot Password?</a>
                </div>
                
                <button type="submit" class="login-btn">Sign In</button>
            </form>
            
            <div class="divider">
                <span>or</span>
            </div>
            
            <div class="social-login">
                <button type="button" class="social-btn google-btn" id="googleLoginBtn">
                    <i class="fa fa-google"></i>
                    <span>Google</span>
                </button>
            </div>
            
            <div class="register-link">
                Don't have an account? <a href="user-register.html">Register Here</a>
            </div>
        </div>
    </div>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="get-google-config.php"></script>
    <script>
        // Initialize Google Sign-In
        window.onload = function() {
            // Google OAuth Configuration (loaded from server)
            google.accounts.id.initialize({
                client_id: window.GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse
            });
        };
        
        // Handle Google Login Response
        function handleCredentialResponse(response) {
            // The response.credential is a JWT token
            const token = response.credential;
            const alertDiv = document.getElementById('alertMessage');
            
            // Send token to backend for verification
            fetch('process-google-login.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    token: token
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alertDiv.className = 'alert-message show alert-success';
                    alertDiv.textContent = data.message;
                    setTimeout(() => {
                        window.location.href = 'index.php';
                    }, 1500);
                } else {
                    alertDiv.className = 'alert-message show alert-danger';
                    alertDiv.textContent = data.message;
                }
            })
            .catch(error => {
                alertDiv.className = 'alert-message show alert-danger';
                alertDiv.textContent = 'Google login failed. Please try again.';
                console.error('Error:', error);
            });
        }
        
        // Google Login Button Click Handler
        document.getElementById('googleLoginBtn').addEventListener('click', function(e) {
            e.preventDefault();
            
            // Trigger Google Sign-In prompt
            google.accounts.id.prompt((notification) => {
                if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                    // If prompt is not displayed, use the One Tap UI
                    google.accounts.id.renderButton(
                        document.getElementById('googleLoginBtn'),
                        { 
                            theme: 'outline',
                            size: 'large',
                            text: 'signin'
                        }
                    );
                }
            });
        });
    </script>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const alertDiv = document.getElementById('alertMessage');
            
            fetch('process-login.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alertDiv.className = 'alert-message show alert-success';
                    alertDiv.textContent = data.message;
                    setTimeout(() => {
                        window.location.href = 'index.php';
                    }, 1500);
                } else {
                    alertDiv.className = 'alert-message show alert-danger';
                    alertDiv.textContent = data.message;
                }
            })
            .catch(error => {
                alertDiv.className = 'alert-message show alert-danger';
                alertDiv.textContent = 'An error occurred. Please try again.';
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>

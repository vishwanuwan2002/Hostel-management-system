<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>User Register - StayEasy</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <style>
        /* CSS styles from original file remain unchanged */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #040726 0%, #0b073a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            animation: slideIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .register-visual {
            background: linear-gradient(135deg, rgba(31, 8, 116, 0.297) 0%, rgba(184, 183, 188, 0.356) 100%), url('image/banner/banner-2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 50px;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .register-visual::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }
        
        .register-visual::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            bottom: -150px;
            left: -150px;
        }
        
        .register-visual-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }
        
        .register-visual h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .register-visual p {
            font-size: 1rem;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .register-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        .register-form-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .register-form-section h3 {
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .register-form-subtitle {
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 4px rgba(245, 87, 108, 0.1);
        }
        
        .form-group input::placeholder {
            color: #bbb;
        }
        
        .register-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            margin-top: 10px;
        }
        
        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
        }
        
        .register-btn:active {
            transform: translateY(0);
        }
        
        .alert-message {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            display: none;
        }
        
        .alert-message.show {
            display: block;
        }
        
        .alert-danger {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .alert-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .login-link {
            text-align: center;
            margin-top: 15px;
            font-size: 0.95rem;
            color: #666;
        }
        
        .login-link a {
            color: #f5576c;
            text-decoration: none;
            font-weight: 700;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .register-container {
                flex-direction: column;
            }
            
            .register-visual {
                padding: 30px;
                min-height: 250px;
            }
            
            .register-visual h2 {
                font-size: 1.8rem;
            }
            
            .register-form-section {
                padding: 30px;
                max-height: none;
            }
            
            .register-icon {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-visual">
            <div class="register-visual-content">
                <div class="register-icon">
                    <i class="fa fa-user-plus"></i>
                </div>
                <h2>Join Us Today!</h2>
                <p>Create an account and start exploring the best hostels and accommodations with ease.</p>
            </div>
        </div>
        
        <div class="register-form-section">
            <h3>Create Account</h3>
            <p class="register-form-subtitle">Fill in the details to get started</p>
            
            <div id="alertMessage" class="alert-message"></div>
            
            <form id="registerForm" method="POST" action="process-register.php">
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full_name" placeholder="E.g., John Smith" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="E.g., example@domain.com" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" name="phone_number" placeholder="E.g., +1234567890"> </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Choose a secure password" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter your password" required>
                </div>
                
                <button type="submit" class="register-btn">Create Account</button>
            </form>
            
            <div class="login-link">
                Already have an account? <a href="user-login.html">Login Here</a>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const alertDiv = document.getElementById('alertMessage');
            
            // Client-side validation
            if (password !== confirmPassword) {
                alertDiv.className = 'alert-message show alert-danger';
                alertDiv.textContent = 'Passwords do not match!';
                return;
            }
            
            if (password.length < 6) {
                alertDiv.className = 'alert-message show alert-danger';
                alertDiv.textContent = 'Password must be at least 6 characters!';
                return;
            }
            
            const formData = new FormData(this);
            // You may want to remove the confirm_password field before sending it to the server
            formData.delete('confirm_password');
            
            fetch('process-register.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alertDiv.className = 'alert-message show alert-success';
                    alertDiv.textContent = data.message;
                    setTimeout(() => {
                        window.location.href = 'user-login.html';
                    }, 1500);
                } else {
                    alertDiv.className = 'alert-message show alert-danger';
                    alertDiv.textContent = data.message;
                }
            })
            .catch(error => {
                alertDiv.className = 'alert-message show alert-danger';
                alertDiv.textContent = 'An error occurred. Please try again.';
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
